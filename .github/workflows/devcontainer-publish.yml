# =====================================================================
# devcontainer-publish.yml : publie l'image du Codespace Arduino STeaMi
# sur ghcr.io. Même mécanique que le dépôt de l'image de R5.Real.10.
#
# Pourquoi : les dépôts d'élèves sont créés à partir du modèle
# steamicc/arduino-steami-starter, sans prebuild. En publiant l'image une
# fois ici, la création de leur Codespace se réduit à un téléchargement
# (l'"image" de leur .devcontainer/devcontainer.json, voir exemples/) au
# lieu d'une construction complète : PlatformIO, toolchain STM32, drivers.
#
# L'image est construite à partir de .devcontainer/source/ et n'est
# publiée que si le smoke-test passe dans le conteneur.
#
# Déclencheurs :
#   - push d'un tag git `devcontainer-AAAA.MM.N` : d'habitude posé par le
#     robot publier-image.yml, avec le jeton de l'App, à la fusion de la
#     PR « chore: image AAAA.MM.N » (un tag poussé avec GITHUB_TOKEN ne
#     déclencherait pas ce workflow). En secours, il peut être poussé à la
#     main, depuis n'importe quelle branche, donc avant de fusionner ;
#   - workflow_dispatch avec la version en paramètre, à la main :
#     uniquement une fois ce fichier présent sur la branche par défaut.
#
# Une fois l'image poussée, le job `aval` lance tout de suite le robot
# suivre-image du modèle arduino-steami-starter, qui ouvre sa PR vers la
# nouvelle version. Son cron quotidien reste le secours si le lancement
# échoue (CONTRIBUTING.md, « Publier une nouvelle image »).
#
# Jamais de tag `latest`, et une version publiée n'est jamais écrasée :
# les dépôts d'élèves déjà créés pointent dessus.
#
# amd64 seulement, l'architecture de Codespaces.
#
# Neutralisé dans les forks, comme devcontainer.yml.
# =====================================================================
name: devcontainer-publish

on:
  push:
    tags:
      - "devcontainer-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image, au format AAAA.MM.N (exemple : 2026.11.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  # En minuscules : ghcr.io refuse les majuscules dans un nom d'image.
  IMAGE: ghcr.io/steamicc/arduino-steami-devcontainer

# Une seule publication à la fois : un push de tag et un workflow_dispatch pour
# la même version passeraient tous deux la vérification « existe déjà », qui a
# lieu une quinzaine de minutes avant le push, et le second écraserait le premier.
concurrency:
  group: devcontainer-publish
  cancel-in-progress: false

jobs:
  publish:
    name: build, smoke-test & publish
    # Ne pas tourner dans les forks.
    if: github.repository == 'steamicc/arduino-steami-devcontainer'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Détermine la version
        id: version
        env:
          VERSION_SAISIE: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$VERSION_SAISIE"
          else
            version="${GITHUB_REF_NAME#devcontainer-}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "::error::Version « $version » invalide : le format attendu est AAAA.MM.N"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Connexion à ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse d'écraser une version déjà publiée
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # On ne publie que si le registre répond explicitement que ce tag
          # n'existe pas. Toute autre réponse (panne réseau, accès refusé)
          # arrête le job : dans le doute, on n'écrase rien.
          if sortie=$(docker manifest inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION existe déjà. Choisissez une nouvelle version."
            exit 1
          elif printf '%s' "$sortie" | grep -qiE "manifest unknown|name unknown"; then
            echo "$IMAGE:$VERSION n'existe pas encore : la publication peut continuer."
          else
            echo "::error::Impossible de savoir si $IMAGE:$VERSION existe déjà : $sortie"
            exit 1
          fi

      - name: Build, smoke-test & publish
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/source/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ steps.version.outputs.version }}
          # Image publiée : construite de zéro, sans réutiliser de couche.
          noCache: true
          runCmd: .devcontainer/smoke-test.sh
          # L'image n'est poussée que si le smoke-test a réussi.
          push: always
          # Garde l'uid 1000 de vscode, comme dans devcontainer.yml : sinon
          # devcontainers/ci le remplace par celui du runner (1001), et
          # /opt/steami et /opt/platformio (uid 1000) ne sont plus accessibles.
          skipContainerUserIdUpdate: true

      - name: Résumé et suite à donner
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Image construite et testée : \`$IMAGE:$VERSION\`"
            echo
            echo "Le push vers ghcr.io a lieu à la toute fin du job, dans l'étape « Post Build, smoke-test & publish » : vérifiez qu'elle est verte."
            echo
            # Les deux configurations distribuées : celle de ce dépôt et le
            # modèle recopié dans le template.
            retard=""
            for f in .devcontainer/devcontainer.json exemples/devcontainer.json; do
              grep -q "$IMAGE:$VERSION\"" "$f" || retard="$retard \`$f\`"
            done
            if [ -z "$retard" ]; then
              echo "La configuration distribuée de ce dépôt et le modèle \`exemples/devcontainer.json\` pointent déjà sur cette version."
            else
              echo "**À faire** : mettre cette version dans$retard."
            fi
            echo
            echo "Une fois l'image publiée, le job « robots en aval » lance le robot \`suivre-image\` du dépôt modèle \`steamicc/arduino-steami-starter\`, qui ouvre sa PR vers cette version (s'il n'a pas pu être lancé, son cron quotidien prend le relais). Les dépôts d'élèves déjà créés gardent l'ancienne."
            echo
            echo "À la première publication, rendre le paquet **public** (Packages → Package settings → Change visibility), puis vérifier qu'un \`docker pull $IMAGE:$VERSION\` fonctionne sans être connecté, comme un élève."
          } >> "$GITHUB_STEP_SUMMARY"

  aval:
    name: robots en aval
    needs: publish
    if: github.repository == 'steamicc/arduino-steami-devcontainer'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Jeton pour les robots en aval
        id: jeton_aval
        continue-on-error: true   # sans jeton, on prévient et les crons prennent le relais
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: steamicc
          repositories: arduino-steami-starter          # les dépôts des cibles, séparés par des virgules
          permission-actions: write

      - name: Déclencher les robots en aval
        continue-on-error: true   # un déclenchement raté ne fait jamais échouer la publication
        env:
          GH_TOKEN: ${{ steps.jeton_aval.outputs.token }}
          JETON: ${{ steps.jeton_aval.outcome }}
        run: |
          if [ "$JETON" != success ]; then
            echo "::warning::Jeton de l'App indisponible : les robots en aval tourneront à leur cron."
            exit 0
          fi
          # Une cible par chaîne "<dépôt> <robot>" ; une cible ratée n'empêche pas les suivantes.
          for cible in "arduino-steami-starter suivre-image.yml"; do
            read -r repo workflow <<<"$cible"
            gh workflow run "$workflow" -R "steamicc/$repo" \
              || echo "::warning::Robot $workflow de steamicc/$repo non déclenché : son cron prendra le relais (vérifier la permission Actions en écriture de l'App et son installation sur ce dépôt)."
          done
