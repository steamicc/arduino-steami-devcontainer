# =====================================================================
# suivre-paquet.yml : suit les releases du paquet Arduino « STeaMi »
# (steamicc/arduino-steami), installé dans l'image au tag fixé par
# `ARG STEAMI_PAQUET` du Dockerfile.
#
# Une fois par jour, à la demande et après chaque publication du paquet
# (déclenché par publish-arduino-package.yml d'arduino-steami-lib, sans
# entrée), le workflow lit la dernière release du paquet
# (/releases/latest). Si elle est plus récente que le tag de l'image et qu'aucune
# branche ni PR `chore/paquet-<tag>` n'existe, il crée la branche, met à
# jour l'ARG, ouvre la PR et active sa fusion automatique (squash) : elle
# est fusionnée dès que devcontainer.yml est au vert. Si la PR du robot
# pour cette version est déjà ouverte, il vérifie seulement sa fusion
# automatique. Une PR du robot qui, entre-temps, est passée en conflit avec
# main (une release plus ancienne a été fusionnée avant elle : les deux
# réécrivent la même ligne ARG) est fermée avec sa branche, puis recréée
# depuis main, sauf si une personne y a poussé des commits (avertissement).
# À chaque nouvelle PR, les autres PR ouvertes du robot `chore/paquet-*`
# sont fermées (« Superseded by #N »). Rien à faire à la main ensuite : à la fusion,
# publier-image.yml ouvre la PR « chore: image AAAA.MM.N », puis pose à
# sa fusion le tag `devcontainer-AAAA.MM.N` qui publie l'image, et le
# robot suivre-image du modèle suit la nouvelle version (CONTRIBUTING.md,
# « Publier une nouvelle image »).
#
# Les écritures (push, PR, fusion) passent par un jeton de l'App de
# l'organisation, celle qu'utilise déjà steamicc/arduino-steami-lib : une
# PR ouverte avec ce jeton déclenche devcontainer.yml normalement, sans
# approbation manuelle, ce que GITHUB_TOKEN ne permet pas. GITHUB_TOKEN ne
# sert qu'aux lectures.
#
# Prérequis, à régler une fois :
#   - les secrets RELEASE_APP_ID et RELEASE_APP_SECRET (dépôt ou
#     organisation), sinon le workflow échoue en le disant ;
#   - l'App installée sur ce dépôt, avec Contents, Pull requests et Actions
#     en écriture (Actions : la garde relance un check exigé rouge) ;
#   - « Allow auto-merge » et le squash autorisés (Settings > General) ;
#   - un ruleset « CI verte avant fusion » sur main, qui exige les checks
#     « tests des commandes » et « build & smoke-test », sans acteur de
#     contournement. Sans lui, la fusion automatique fusionnerait même une
#     CI rouge : le workflow ne l'active pas et laisse la PR à fusionner à
#     la main.
#
# La fusion automatique passe par la garde commune
# .github/scripts/garde-fusion-auto.sh (copie à l'identique dans les dépôts
# steamicc, empreinte vérifiée par tests/garde-fusion-auto.bats) : jamais
# pour une PR venue d'un fork ou ouverte par un autre auteur que le robot.
# Si elle est déjà activée et qu'un check exigé est rouge, la garde le
# relance une fois, puis fait échouer le run du robot s'il reste rouge.
#
# La fusion automatique n'est pas activée non plus si
# `.devcontainer/source/boards/steami.json` diffère de celui
# d'arduino-steami-lib au nouveau tag : il faut alors le reporter à la main
# dans la PR. Pour une PR déjà ouverte, la comparaison se fait avec la
# branche de la PR : une fois les différences reportées, le passage suivant
# active la fusion automatique.
#
# Pour garder la PR ouverte (fusion à la main), la passer en brouillon ou
# lui mettre l'étiquette « garder-ouverte » : le robot ne réactive alors
# plus sa fusion automatique.
#
# Neutralisé dans les forks, comme les autres workflows.
# =====================================================================
name: suivre-paquet

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# GITHUB_TOKEN en lecture seule : les écritures utilisent le jeton de l'App.
permissions:
  contents: read
  pull-requests: read

# Une seule exécution à la fois : deux lancements simultanés créeraient la même branche.
concurrency:
  group: suivre-paquet
  cancel-in-progress: false

jobs:
  suivre:
    name: nouvelle release du paquet ?
    # Ne pas tourner dans les forks.
    if: github.repository == 'steamicc/arduino-steami-devcontainer'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Vérifie les secrets de l'App
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_CLE: ${{ secrets.RELEASE_APP_SECRET }}
        run: |
          manquants=""
          [ -n "$APP_ID" ] || manquants="$manquants RELEASE_APP_ID"
          [ -n "$APP_CLE" ] || manquants="$manquants RELEASE_APP_SECRET"
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) manquant(s) :$manquants. Ajoutez RELEASE_APP_ID et RELEASE_APP_SECRET (Settings > Secrets and variables > Actions, ou au niveau de l'organisation) et installez sur ce dépôt l'App de l'organisation utilisée par arduino-steami-lib : sans elle, le robot ne peut ni ouvrir la PR ni activer sa fusion automatique."
            exit 1
          fi

      # Sans `owner` ni `repositories`, le jeton ne vaut que pour ce dépôt.
      - name: Jeton de l'App (ce dépôt seulement)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # L'App ID convient : l'action traite `client-id` et `app-id` (déprécié) de la même façon.
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          permission-contents: write
          permission-pull-requests: write
          # La garde de fusion auto relance une fois un check exigé rouge (gh run rerun).
          permission-actions: write

      - name: Explique l'échec du jeton
        if: failure() && steps.app.outcome == 'failure'
        run: |
          echo "::error::Impossible d'obtenir un jeton de l'App avec RELEASE_APP_ID et RELEASE_APP_SECRET. Vérifiez que l'App est installée sur steamicc/arduino-steami-devcontainer avec Contents, Pull requests et Actions en écriture, et que la clé privée est bien celle de cette App."
          exit 1

      # Le jeton de l'App reste dans la configuration git : le push l'utilise.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Compare la dernière release au tag de l'image
        id: comparaison
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          actuel=$(sed -n 's/^ARG STEAMI_PAQUET=//p' .devcontainer/source/Dockerfile)
          derniere=$(gh api repos/steamicc/arduino-steami/releases/latest --jq .tag_name)
          for t in "$actuel" "$derniere"; do
            if ! printf '%s' "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag « $t » invalide : le format attendu est vX.Y.Z"
              exit 1
            fi
          done
          echo "Tag de l'image : $actuel ; dernière release du paquet : $derniere"
          plus_recente=$(printf '%s\n%s\n' "${actuel#v}" "${derniere#v}" | sort -V | tail -n1)
          if [ "$actuel" = "$derniere" ] || [ "v$plus_recente" != "$derniere" ]; then
            echo "L'image est à jour."
            exit 0
          fi
          branche="chore/paquet-$derniere"
          # PR du robot déjà ouverte pour cette version (branche de ce dépôt,
          # ouverte par l'App) : on ne vérifie que sa fusion automatique.
          pr=$(gh pr list --state open --head "$branche" --json number,author,isCrossRepository \
                 | jq -r --arg auteur "app/$APP_SLUG" \
                     '[.[] | select((.isCrossRepository | not) and .author.login == $auteur) | .number][0] // empty')
          fermer=""
          action=""
          if [ -n "$pr" ]; then
            # Une PR plus ancienne a pu être fusionnée avant celle-ci (même ligne
            # ARG réécrite) : GitHub la marque alors en conflit, pour toujours.
            # « UNKNOWN » : le calcul est en cours, on réessaie un moment.
            for _ in 1 2 3 4 5 6; do
              vue=$(gh pr view "$pr" --json mergeable,commits,isDraft,labels)
              [ "$(jq -r .mergeable <<< "$vue")" != UNKNOWN ] && break
              sleep 5
            done
            conflit=$(.github/scripts/suivre-paquet.sh conflit "$APP_SLUG" <<< "$vue")
            case "$conflit" in
              recreer)
                echo "La PR #$pr ($branche) est en conflit avec main : elle sera fermée et recréée depuis main."
                fermer=$pr
                pr=""
                action=nouvelle ;;
              garde)
                echo "::warning::La PR #$pr ($branche) est en conflit avec main, mais elle est en brouillon ou porte l'étiquette « garder-ouverte » : laissée telle quelle, à rebaser ou à fermer à la main."
                exit 0 ;;
              humain)
                echo "::warning::La PR #$pr ($branche) est en conflit avec main, mais elle contient des commits qui ne sont pas du robot : à rebaser ou à fermer à la main."
                exit 0 ;;
              *)
                echo "La PR #$pr ($branche) est déjà ouverte : vérification de sa fusion automatique."
                action=existante ;;
            esac
          fi
          # Sans PR ouverte : branche ou PR (ouverte ou fermée) déjà là, on ne recommence pas.
          # (Si la PR en conflit est à recréer, sa branche est supprimée à l'étape suivante.)
          if [ -n "$action" ]; then
            :
          elif git ls-remote --exit-code --heads origin "$branche" >/dev/null 2>&1 \
             || [ -n "$(gh pr list --state all --head "$branche" --json number --jq '.[].number')" ]; then
            echo "$branche existe déjà : rien à faire."
            exit 0
          else
            action=nouvelle
          fi
          # La définition de la carte est une copie : la fusion automatique
          # n'a lieu que si elle est identique à celle d'arduino-steami-lib au nouveau tag.
          # PR déjà ouverte : on compare la copie de sa branche, où les
          # différences ont pu être reportées ; sinon celle de main.
          locale=.devcontainer/source/boards/steami.json
          if [ "$action" = existante ]; then
            git fetch --quiet --depth=1 origin "refs/heads/$branche"
            git show "FETCH_HEAD:$locale" > "$RUNNER_TEMP/steami-pr.json"
            locale="$RUNNER_TEMP/steami-pr.json"
          fi
          if contenu=$(gh api "repos/steamicc/arduino-steami-lib/contents/boards/steami.json?ref=$derniere" --jq .content 2>/dev/null); then
            if printf '%s' "$contenu" | base64 -d | diff - "$locale"; then
              boards=identique
            else
              boards=different
            fi
          else
            boards=inconnu
          fi
          echo "boards/steami.json par rapport à arduino-steami-lib $derniere : $boards"
          {
            echo "action=$action"
            echo "pr=$pr"
            echo "fermer=$fermer"
            echo "actuel=$actuel"
            echo "derniere=$derniere"
            echo "branche=$branche"
            echo "boards=$boards"
          } >> "$GITHUB_OUTPUT"

      # PR en conflit avec main (une version plus récente de la même ligne ARG a
      # été fusionnée) : la fermer en supprimant sa branche, puis repartir de main.
      - name: Ferme la PR en conflit
        if: steps.comparaison.outputs.fermer != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FERMER: ${{ steps.comparaison.outputs.fermer }}
        run: |
          set -euo pipefail
          gh pr close "$FERMER" --delete-branch \
            --comment "En conflit avec main : cette PR est fermée, le robot en rouvre une depuis main."

      - name: Crée la branche et met à jour l'ARG
        if: steps.comparaison.outputs.action == 'nouvelle'
        env:
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Commit attribué à l'App, comme la PR.
          id_bot=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id_bot}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE"
          sed -i "s/^ARG STEAMI_PAQUET=.*/ARG STEAMI_PAQUET=$DERNIERE/" .devcontainer/source/Dockerfile
          grep -qx "ARG STEAMI_PAQUET=$DERNIERE" .devcontainer/source/Dockerfile
          git commit -am "chore: paquet arduino-steami $DERNIERE"
          git push origin "$BRANCHE"

      # Ouverte avec le jeton de l'App : devcontainer.yml se déclenche sur la PR.
      - name: Ouvre la PR
        id: ouverture
        if: steps.comparaison.outputs.action == 'nouvelle'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTUEL: ${{ steps.comparaison.outputs.actuel }}
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
          BOARDS: ${{ steps.comparaison.outputs.boards }}
        run: |
          set -euo pipefail
          if [ "$BOARDS" = identique ]; then
            fusion="La fusion automatique (squash) est activée si le dépôt a un ruleset qui exige la CI verte : cette PR est alors fusionnée dès que \`devcontainer.yml\` est au vert. \`.devcontainer/source/boards/steami.json\` est identique à celui d'arduino-steami-lib au nouveau tag."
          else
            fusion="**Fusion automatique désactivée** : \`.devcontainer/source/boards/steami.json\` diffère de celui d'arduino-steami-lib au nouveau tag (ou n'a pas pu être lu). Reporter les différences dans cette PR (\`gh api \"repos/steamicc/arduino-steami-lib/contents/boards/steami.json?ref=$DERNIERE\" --jq .content | base64 -d | diff - .devcontainer/source/boards/steami.json\`) : le passage suivant du robot active alors la fusion automatique (sinon, la fusionner à la main une fois les vérifications au vert)."
          fi
          cat > corps.md <<EOT
          Le paquet Arduino STeaMi a une nouvelle release : \`$DERNIERE\` (l'image utilise \`$ACTUEL\`).
          https://github.com/steamicc/arduino-steami/releases/tag/$DERNIERE

          Cette PR change seulement \`ARG STEAMI_PAQUET\` dans \`.devcontainer/source/Dockerfile\`. Le smoke-test (devcontainer.yml) construit l'image et compile les exemples de référence sans réseau.

          $fusion

          La suite est automatique, une fois la PR fusionnée (CONTRIBUTING.md, « Publier une nouvelle image ») :
          1. le robot \`publier-image\` ouvre la PR « chore: image AAAA.MM.N » (ou s'en remet à sa PR d'image déjà ouverte) et active sa fusion automatique ;
          2. à la fusion de cette PR, il pose le tag \`devcontainer-AAAA.MM.N\`, qui déclenche \`devcontainer-publish\` : l'image est construite, testée et publiée ;
          3. le robot \`suivre-image\` du modèle \`steamicc/arduino-steami-starter\` ouvre sa PR vers cette version.
          EOT
          url=$(gh pr create --base main --head "$BRANCHE" \
            --title "chore: paquet arduino-steami $DERNIERE" \
            --body-file corps.md)
          echo "PR ouverte : $url"
          numero="${url##*/}"
          if ! printf '%s' "$numero" | grep -Eq '^[0-9]+$'; then
            echo "::error::Numéro de PR introuvable dans « $url »"
            exit 1
          fi
          echo "pr=$numero" >> "$GITHUB_OUTPUT"

      # Une PR d'une release plus ancienne réécrit la même ligne ARG : une fois
      # l'une fusionnée, l'autre serait en conflit pour toujours. Seules les PR
      # de l'App, dans ce dépôt, dont la branche est chore/paquet-*, sont fermées.
      - name: Ferme les PR des releases dépassées
        if: steps.comparaison.outputs.action != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.ouverture.outputs.pr || steps.comparaison.outputs.pr }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Numéro de PR introuvable (« $PR »)"
            exit 1
          fi
          # Pas de --author (index de recherche en retard) : filtre sur l'auteur dans le script.
          anciennes=$(gh pr list --state open --limit 200 \
            --json number,headRefName,isCrossRepository,author \
            | .github/scripts/suivre-paquet.sh anciennes "$BRANCHE" "$APP_SLUG")
          for n in $anciennes; do
            echo "Fermeture de la PR #$n (release dépassée)."
            gh pr close "$n" --delete-branch --comment "Superseded by #$PR."
          done

      # La garde commune (.github/scripts/garde-fusion-auto.sh, copie à l'identique,
      # tests/garde-fusion-auto.bats) refuse un fork ou un autre auteur que le
      # robot, exige les deux jobs de devcontainer.yml sur la branche par défaut
      # sans contournement possible, respecte brouillon et « garder-ouverte »,
      # relance une fois un check exigé rouge, puis fait échouer le run.
      - name: Active la fusion automatique
        if: steps.comparaison.outputs.action != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.ouverture.outputs.pr || steps.comparaison.outputs.pr }}
          BOARDS: ${{ steps.comparaison.outputs.boards }}
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
        run: |
          set -euo pipefail
          if [ "$BOARDS" != identique ]; then
            echo "::warning::PR #$PR : fusion automatique non activée, car .devcontainer/source/boards/steami.json diffère de celui d'arduino-steami-lib $DERNIERE (ou n'a pas pu être lu). Reportez les différences dans la PR : le passage suivant du robot activera sa fusion automatique (ou fusionnez-la à la main une fois la CI au vert)."
            exit 0
          fi
          bash .github/scripts/garde-fusion-auto.sh "$GITHUB_REPOSITORY" "$PR" "$APP_SLUG" "tests des commandes" "build & smoke-test"
