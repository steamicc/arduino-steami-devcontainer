# =====================================================================
# suivre-daplink.yml : suit les releases du firmware DAPLink de la STeaMi
# (steamicc/DAPLink), embarqué dans l'image : la release et le sha256 du
# fichier stm32f103xb_steami32_if_crc.bin sont fixés par
# `ARG STEAMI_DAPLINK_RELEASE` et `ARG STEAMI_DAPLINK_SHA256` de
# .devcontainer/source/Dockerfile (le smoke-test les relit).
#
# Une fois par jour, à la demande et après chaque release DAPLink (déclenché
# par le dépôt DAPLink, sans entrée), le workflow lit la dernière release
# publiée (/releases/latest). Si elle est différente de la release épinglée
# et plus récente (date, puis numéro : AAAA-MM-JJ.N), si elle contient le
# fichier stm32f103xb_steami32_if_crc.bin (sinon il attend le passage
# suivant) et si GitHub publie son empreinte sha256 (obligatoire), il
# télécharge le fichier, vérifie son sha256 contre cette empreinte, change
# les deux ARG et ouvre la PR `chore/daplink-<release>` (points remplacés par
# des tirets). Toutes les releases sont épinglées, sans validation humaine,
# même une recompilation identique : seuls les checks exigés gardent la
# fusion. La règle de version et l'édition du Dockerfile sont dans
# .github/scripts/suivre-daplink.sh (tests : tests/suivre-daplink.bats).
#
# La PR d'un passage précédent pour la même release est réutilisée. Les PR
# `chore/daplink-*` plus anciennes encore ouvertes, ouvertes par l'App dans ce
# dépôt, sont fermées avec le commentaire « Superseded by #n. » : elles
# épingleraient une release dépassée. Rien d'autre n'est fermé.
#
# À la fusion de la PR, .devcontainer/source/ a changé : publier-image.yml
# ouvre la PR « chore: image AAAA.MM.N », puis pose à sa fusion le tag
# `devcontainer-AAAA.MM.N` qui publie l'image (CONTRIBUTING.md, « Publier
# une nouvelle image »). Rien d'autre à brancher.
#
# Fusion automatique (squash), par la garde commune
# .github/scripts/garde-fusion-auto.sh (copie à l'identique dans les dépôts
# steamicc, empreinte vérifiée par tests/garde-fusion-auto.bats), seulement si :
#   - la PR vient de ce dépôt et a été ouverte par le robot ;
#   - les règles de la branche par défaut exigent « tests des commandes » et
#     « build & smoke-test » ;
#   - aucun ruleset qui porte ces vérifications ne laisse l'acteur du jeton
#     les contourner (`current_user_can_bypass` vaut `never`) : sinon GitHub
#     fusionnerait tout de suite, même avec une CI rouge ;
#   - la PR n'est ni en brouillon ni étiquetée `garder-ouverte`.
# Si la fusion automatique est déjà activée et qu'un check exigé est rouge,
# la garde le relance une fois, puis fait échouer le run du robot.
# Le ruleset d'organisation (Default_Ruleset) n'est jamais lu ni modifié.
#
# Prérequis : secrets RELEASE_APP_ID et RELEASE_APP_SECRET ; App installée
# sur ce dépôt (Contents, Pull requests et Actions en écriture) ; « Allow auto-merge »
# et le squash autorisés ; ruleset « CI verte avant fusion » sur main, sans
# acteur de contournement.
#
# Neutralisé dans les forks.
# =====================================================================
name: suivre-daplink

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

# GITHUB_TOKEN en lecture seule : les écritures utilisent le jeton de l'App.
permissions:
  contents: read
  pull-requests: read

# Une seule exécution à la fois : deux lancements simultanés créeraient la même branche.
concurrency:
  group: suivre-daplink
  cancel-in-progress: false

jobs:
  suivre:
    name: nouvelle release DAPLink ?
    # Ne pas tourner dans les forks.
    if: github.repository == 'steamicc/arduino-steami-devcontainer'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Pas de repli sur GITHUB_TOKEN : ses PR n'ont pas de CI sans approbation.
      - name: Vérifie les secrets de l'App
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_CLE: ${{ secrets.RELEASE_APP_SECRET }}
        run: |
          manquants=""
          [ -n "$APP_ID" ] || manquants="$manquants RELEASE_APP_ID"
          [ -n "$APP_CLE" ] || manquants="$manquants RELEASE_APP_SECRET"
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) manquant(s) :$manquants. Ajoutez RELEASE_APP_ID et RELEASE_APP_SECRET (Settings > Secrets and variables > Actions, ou au niveau de l'organisation) et installez sur ce dépôt l'App de l'organisation utilisée par arduino-steami-lib : sans elle, le robot ne peut ni ouvrir la PR ni activer sa fusion automatique."
            exit 1
          fi

      # Sans `owner` ni `repositories`, le jeton ne vaut que pour ce dépôt.
      - name: Jeton de l'App (ce dépôt seulement)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          permission-contents: write
          permission-pull-requests: write
          # La garde de fusion auto relance une fois un check exigé rouge (gh run rerun).
          permission-actions: write

      - name: Explique l'échec du jeton
        if: failure() && steps.app.outcome == 'failure'
        run: |
          echo "::error::Impossible d'obtenir un jeton de l'App avec RELEASE_APP_ID et RELEASE_APP_SECRET. Vérifiez que l'App est installée sur steamicc/arduino-steami-devcontainer avec Contents, Pull requests et Actions en écriture, et que la clé privée est bien celle de cette App."
          exit 1

      # Le jeton de l'App reste dans la configuration git : le push l'utilise.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Compare la dernière release DAPLink à l'image
        id: comparaison
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          script=.github/scripts/suivre-daplink.sh
          release=$(gh api repos/steamicc/DAPLink/releases/latest)
          derniere=$(jq -r .tag_name <<<"$release")
          # Sortie 2 (message sur stderr) si une des deux releases n'est pas AAAA-MM-JJ.N.
          if ! actuel=$("$script" lire) || ! verdict=$("$script" comparer "$actuel" "$derniere"); then
            echo "::error::Release invalide : épinglée « ${actuel:-?} », dernière « $derniere » (format attendu : AAAA-MM-JJ.N)."
            exit 1
          fi
          echo "Release épinglée : $actuel ; dernière release DAPLink : $derniere"
          if [ "$verdict" = a_jour ]; then
            echo "L'image est à jour."
            exit 0
          fi
          binaire="stm32f103xb_steami32_if_crc.bin"
          if ! jq -e --arg a "$binaire" 'any(.assets[]; .name == $a)' <<<"$release" >/dev/null; then
            echo "::warning::La release $derniere n'a pas (encore) le fichier $binaire : rien à faire."
            exit 0
          fi
          # Empreinte publiée par GitHub pour le fichier (« sha256:<hex> ») : obligatoire.
          empreinte=$(jq -r --arg a "$binaire" \
            'first(.assets[] | select(.name == $a)) | .digest // ""' <<<"$release")
          if [ -z "$empreinte" ]; then
            echo "::error::GitHub ne publie pas d'empreinte sha256 pour $binaire dans la release $derniere : épinglage refusé."
            exit 1
          fi
          branche=$("$script" branche "$derniere")
          # --head filtre sur le seul nom de branche : il trouve aussi les PR venues
          # d'un fork avec une branche du même nom. On ne garde que les PR dont la
          # branche est dans ce dépôt (isCrossRepository faux).
          prs=$(gh pr list --state all --head "$branche" --limit 100 \
            --json number,state,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository | not)]')
          # PR déjà ouverte pour cette release : réutilisée seulement si c'est le
          # robot qui l'a ouverte (gh écrit app/<slug>).
          ouverte=$(jq -c 'first(.[] | select(.state == "OPEN")) // empty' <<<"$prs")
          if [ -n "$ouverte" ]; then
            pr=$(jq -r .number <<<"$ouverte")
            auteur=$(jq -r .author.login <<<"$ouverte")
            if [ "$auteur" != "app/$APP_SLUG" ] && [ "$auteur" != "${APP_SLUG}[bot]" ]; then
              echo "::warning::La PR #$pr ($branche) a été ouverte par $auteur, pas par le robot : rien à faire."
              exit 0
            fi
            echo "La PR #$pr est déjà ouverte pour $branche : vérification de sa fusion automatique."
            {
              echo "action=existante"
              echo "pr=$pr"
              echo "derniere=$derniere"
              echo "branche=$branche"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR fermée ou fusionnée : on ne recommence pas.
          if [ "$(jq length <<<"$prs")" -gt 0 ]; then
            echo "Une PR fermée ou fusionnée existe déjà pour $branche : rien à faire."
            exit 0
          fi
          # Branche sans PR : un passage précédent a poussé la branche, puis
          # l'ouverture de la PR a échoué. On garde la branche et on ouvre la PR.
          pousser=true
          if git ls-remote --exit-code --heads origin "$branche" >/dev/null 2>&1; then
            echo "::warning::La branche $branche existe sans PR : ouverture de la PR sur cette branche."
            pousser=false
          fi
          {
            echo "action=nouvelle"
            echo "pousser=$pousser"
            echo "actuel=$actuel"
            echo "derniere=$derniere"
            echo "binaire=$binaire"
            echo "empreinte=$empreinte"
            echo "branche=$branche"
          } >> "$GITHUB_OUTPUT"

      - name: Crée la branche et épingle le firmware
        if: steps.comparaison.outputs.action == 'nouvelle' && steps.comparaison.outputs.pousser == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
          BINAIRE: ${{ steps.comparaison.outputs.binaire }}
          EMPREINTE: ${{ steps.comparaison.outputs.empreinte }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
        run: |
          set -euo pipefail
          # Le sha256 est calculé sur le fichier reçu, pas sur les métadonnées de la release.
          dl="$RUNNER_TEMP/daplink"
          mkdir -p "$dl"
          curl -fL --retry 3 --silent --show-error -o "$dl/$BINAIRE" \
            "https://github.com/steamicc/DAPLink/releases/download/$DERNIERE/$BINAIRE"
          sha=$(sha256sum "$dl/$BINAIRE" | cut -d' ' -f1)
          echo "sha256 de $BINAIRE : $sha"
          # L'empreinte publiée par GitHub est obligatoire et doit correspondre au fichier reçu.
          if [ -z "$EMPREINTE" ] || [ "$EMPREINTE" != "sha256:$sha" ]; then
            echo "::error::sha256 différent de l'empreinte publiée par GitHub (« $EMPREINTE »)"
            exit 1
          fi
          # Commit attribué à l'App, comme la PR.
          id_bot=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id_bot}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE"
          .github/scripts/suivre-daplink.sh epingler "$DERNIERE" "$sha"
          git commit -am "chore: firmware DAPLink $DERNIERE"
          git push origin "$BRANCHE"

      # Ouverte avec le jeton de l'App : devcontainer.yml se déclenche sur la PR.
      - name: Ouvre la PR
        id: ouverture
        if: steps.comparaison.outputs.action == 'nouvelle'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTUEL: ${{ steps.comparaison.outputs.actuel }}
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
          BINAIRE: ${{ steps.comparaison.outputs.binaire }}
          EMPREINTE: ${{ steps.comparaison.outputs.empreinte }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
        run: |
          set -euo pipefail
          corps="$RUNNER_TEMP/corps.md"
          cat > "$corps" <<EOT
          Le firmware DAPLink de la STeaMi a une nouvelle release : \`$DERNIERE\` (l'image embarque \`$ACTUEL\`).
          https://github.com/steamicc/DAPLink/releases/tag/$DERNIERE

          Cette PR change seulement \`ARG STEAMI_DAPLINK_RELEASE\` et \`ARG STEAMI_DAPLINK_SHA256\` dans \`.devcontainer/source/Dockerfile\` : le sha256 de \`$BINAIRE\` est \`${EMPREINTE#sha256:}\`, calculé sur le fichier de la release et conforme à l'empreinte publiée par GitHub. Toutes les releases DAPLink sont épinglées, même une recompilation identique.

          Le check \`build & smoke-test\` construit l'image (le Dockerfile télécharge le firmware et revérifie son sha256) et le smoke-test relit les deux \`ARG\`. Un échec indique un firmware illisible ou un sha256 incohérent : ne pas fusionner.

          La fusion automatique (squash) est activée si les règles de main l'autorisent : la PR est alors fusionnée dès que les checks exigés sont verts. Pour l'éviter, la passer en brouillon ou lui mettre l'étiquette \`garder-ouverte\`.

          **Sa fusion publie une nouvelle image.** La suite est automatique (CONTRIBUTING.md, « Publier une nouvelle image ») :
          1. le robot \`publier-image\` ouvre la PR « chore: image AAAA.MM.N » et active sa fusion automatique ;
          2. à la fusion de cette PR, il pose le tag \`devcontainer-AAAA.MM.N\`, qui déclenche \`devcontainer-publish\` : l'image est construite, testée et publiée.
          EOT
          url=$(gh pr create --base main --head "$BRANCHE" \
            --title "chore: firmware DAPLink $DERNIERE" \
            --body-file "$corps")
          echo "PR ouverte : $url"
          numero="${url##*/}"
          if ! printf '%s' "$numero" | grep -Eq '^[0-9]+$'; then
            echo "::error::Numéro de PR introuvable dans « $url »"
            exit 1
          fi
          echo "pr=$numero" >> "$GITHUB_OUTPUT"

      # Une PR d'une release plus ancienne épinglerait un firmware dépassé et
      # entrerait en conflit avec celle-ci. Seules les PR de l'App, dans ce dépôt,
      # et dont la branche est chore/daplink-*, sont fermées.
      - name: Ferme les PR des releases dépassées
        if: steps.comparaison.outputs.action != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.ouverture.outputs.pr || steps.comparaison.outputs.pr }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Numéro de PR introuvable (« $PR »)"
            exit 1
          fi
          # Pas de --author (index de recherche en retard) : filtre sur l'auteur en jq.
          anciennes=$(gh pr list --state open --limit 200 \
            --json number,headRefName,isCrossRepository,author \
            | jq -r --arg branche "$BRANCHE" --arg a1 "app/$APP_SLUG" --arg a2 "${APP_SLUG}[bot]" \
              '.[] | select((.isCrossRepository | not)
                and (.headRefName | startswith("chore/daplink-"))
                and .headRefName != $branche
                and (.author.login == $a1 or .author.login == $a2)) | .number')
          for n in $anciennes; do
            echo "Fermeture de la PR #$n (release dépassée)."
            gh pr close "$n" --delete-branch --comment "Superseded by #$PR."
          done

      # La garde commune (.github/scripts/garde-fusion-auto.sh, copie à l'identique,
      # tests/garde-fusion-auto.bats) refuse un fork ou un autre auteur que le
      # robot, exige les deux jobs de devcontainer.yml sur la branche par défaut
      # sans contournement possible, respecte brouillon et « garder-ouverte »,
      # relance une fois un check exigé rouge, puis fait échouer le run.
      - name: Active la fusion automatique
        if: steps.comparaison.outputs.action != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.ouverture.outputs.pr || steps.comparaison.outputs.pr }}
        run: |
          set -euo pipefail
          bash .github/scripts/garde-fusion-auto.sh "$GITHUB_REPOSITORY" "$PR" "$APP_SLUG" "tests des commandes" "build & smoke-test"
