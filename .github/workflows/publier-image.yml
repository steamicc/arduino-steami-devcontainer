# =====================================================================
# publier-image.yml : publie l'image sans geste manuel après la fusion
# d'un changement de `.devcontainer/source/`, le seul chemin qui change
# le contenu de l'image.
#
# À chaque push sur main (et à la demande, depuis main), le workflow
# demande la décision à .github/scripts/publier-image.sh :
#   - tag V : les deux devcontainer.json citent une version V qui n'a pas
#     encore de tag. C'est le cas quand une PR « chore: image V » vient
#     d'être fusionnée, qu'elle vienne du robot ou de quelqu'un. Le
#     workflow vérifie que ghcr.io n'a pas déjà cette version, puis pose
#     le tag `devcontainer-V` sur le commit poussé : devcontainer-publish
#     se déclenche alors, construit, teste et publie l'image ;
#   - pr V : `.devcontainer/source/` a changé depuis le dernier tag
#     `devcontainer-*`. Si aucune branche ni PR `chore/image-V` n'existe,
#     le workflow crée la branche, met V dans les deux devcontainer.json,
#     ouvre la PR « chore: image V » et active sa fusion automatique
#     (squash) : elle est fusionnée dès que devcontainer.yml est au vert,
#     et le push de la fusion pose le tag. Une seule PR d'image à la
#     fois : si une PR du robot `chore/image-*` est déjà ouverte, il
#     vérifie seulement sa fusion automatique ;
#   - rien : aucun changement de l'image (docs, CI, tests).
# Le robot `suivre-image` du modèle arduino-steami-starter suit ensuite
# la nouvelle version de lui-même (chaque jour, ou à la demande).
#
# Version AAAA.MM.N : mois courant (UTC), N = 1 + le plus grand N des tags
# du mois, ou 1. Elle ne recule jamais (voir le script).
#
# Les écritures (push de branche et de tag, PR, fusion) passent par un
# jeton de l'App de l'organisation, comme suivre-paquet.yml : un tag
# poussé avec GITHUB_TOKEN ne déclencherait pas devcontainer-publish, et
# une PR ouverte avec lui ne déclencherait pas devcontainer.yml.
# GITHUB_TOKEN ne sert qu'aux lectures.
#
# Prérequis : les mêmes que suivre-paquet.yml (secrets RELEASE_APP_ID et
# RELEASE_APP_SECRET, App installée avec Contents et Pull requests en
# écriture, « Allow auto-merge » et squash autorisés, ruleset « CI verte
# avant fusion » qui exige « tests des commandes » et « build &
# smoke-test » ; sans ce ruleset, la fusion automatique n'est pas activée).
#
# Pour garder la PR ouverte (fusion à la main), la passer en brouillon ou
# lui mettre l'étiquette « garder-ouverte » : le robot ne réactive alors
# plus sa fusion automatique.
#
# Neutralisé dans les forks, comme les autres workflows.
# =====================================================================
name: publier-image

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN en lecture seule : les écritures utilisent le jeton de l'App.
permissions:
  contents: read
  pull-requests: read

# Une seule exécution à la fois : deux pushs rapprochés ouvriraient deux PR d'image.
concurrency:
  group: publier-image
  cancel-in-progress: false

env:
  # En minuscules : ghcr.io refuse les majuscules dans un nom d'image.
  IMAGE: ghcr.io/steamicc/arduino-steami-devcontainer

jobs:
  publier:
    name: nouvelle image à publier ?
    # Ne pas tourner dans les forks ; à la demande, seulement depuis main :
    # le tag et la PR partent du commit de l'événement.
    if: github.repository == 'steamicc/arduino-steami-devcontainer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Vérifie les secrets de l'App
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_CLE: ${{ secrets.RELEASE_APP_SECRET }}
        run: |
          manquants=""
          [ -n "$APP_ID" ] || manquants="$manquants RELEASE_APP_ID"
          [ -n "$APP_CLE" ] || manquants="$manquants RELEASE_APP_SECRET"
          if [ -n "$manquants" ]; then
            echo "::error::Secret(s) manquant(s) :$manquants. Ajoutez RELEASE_APP_ID et RELEASE_APP_SECRET (Settings > Secrets and variables > Actions, ou au niveau de l'organisation) et installez sur ce dépôt l'App de l'organisation utilisée par arduino-steami-lib : sans elle, le robot ne peut ni poser le tag de l'image, ni ouvrir la PR d'image, ni activer sa fusion automatique."
            exit 1
          fi

      # Sans `owner` ni `repositories`, le jeton ne vaut que pour ce dépôt.
      - name: Jeton de l'App (ce dépôt seulement)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # L'App ID convient : l'action traite `client-id` et `app-id` (déprécié) de la même façon.
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          permission-contents: write
          permission-pull-requests: write

      - name: Explique l'échec du jeton
        if: failure() && steps.app.outcome == 'failure'
        run: |
          echo "::error::Impossible d'obtenir un jeton de l'App avec RELEASE_APP_ID et RELEASE_APP_SECRET. Vérifiez que l'App est installée sur steamicc/arduino-steami-devcontainer avec Contents et Pull requests en écriture, et que la clé privée est bien celle de cette App."
          exit 1

      # Le jeton de l'App reste dans la configuration git : les push l'utilisent.
      # Tout l'historique et tous les tags : le script compare au dernier tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Décide
        id: decision
        run: |
          set -euo pipefail
          # Le commit de l'événement, pas main au moment de l'exécution.
          decision=$(.github/scripts/publier-image.sh decider "$GITHUB_SHA" "$(date -u +%Y.%m)")
          echo "Décision pour $GITHUB_SHA : $decision"
          action=${decision%% *}
          version=""
          case "$action" in
            tag|pr) version=${decision#* } ;;
            rien) action="" ;;
            *)
              echo "::error::Décision « $decision » inattendue de publier-image.sh."
              exit 1 ;;
          esac
          if [ -n "$version" ] && ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "::error::Version « $version » invalide : le format attendu est AAAA.MM.N"
            exit 1
          fi
          {
            echo "action=$action"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse une version déjà publiée
        if: steps.decision.outputs.action == 'tag'
        env:
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          # Même règle que devcontainer-publish : on ne tague que si le
          # registre répond explicitement que ce tag n'existe pas. Toute
          # autre réponse (panne réseau, accès refusé) arrête le job.
          if sortie=$(docker manifest inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::error::$IMAGE:$VERSION existe déjà sur ghcr.io, sans tag devcontainer-$VERSION dans ce dépôt : tag non posé. Mettez une nouvelle version dans .devcontainer/devcontainer.json et exemples/devcontainer.json (PR « chore: image »)."
            exit 1
          elif printf '%s' "$sortie" | grep -qiE "manifest unknown|name unknown"; then
            echo "$IMAGE:$VERSION n'existe pas encore : le tag peut être posé."
          else
            echo "::error::Impossible de savoir si $IMAGE:$VERSION existe déjà : $sortie"
            exit 1
          fi

      # Poussé avec le jeton de l'App : devcontainer-publish se déclenche sur le tag.
      - name: Pose le tag de l'image
        if: steps.decision.outputs.action == 'tag'
        env:
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          set -euo pipefail
          tag="devcontainer-$VERSION"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "Tag $tag poussé sur $GITHUB_SHA."
          {
            echo "## Tag \`$tag\` posé"
            echo
            echo "Sur le commit $GITHUB_SHA, dont les deux \`devcontainer.json\` citent \`$IMAGE:$VERSION\`."
            echo
            echo "Le tag déclenche \`devcontainer-publish\`, qui construit, teste et publie l'image : $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/devcontainer-publish.yml"
            echo
            echo "Une fois l'image publiée, le robot \`suivre-image\` du modèle \`steamicc/arduino-steami-starter\` ouvre sa PR vers cette version."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cherche une PR d'image
        id: recherche
        if: steps.decision.outputs.action == 'pr'
        env:
          VERSION: ${{ steps.decision.outputs.version }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          branche="chore/image-$VERSION"
          # Une seule PR d'image à la fois : si une PR du robot (branche
          # de ce dépôt, ouverte par l'App) est déjà ouverte, sa version
          # reste valable et la fusionner publiera aussi ce changement ;
          # on ne vérifie que sa fusion automatique.
          pr=$(gh pr list --state open --limit 100 --json number,headRefName,author,isCrossRepository \
                 | jq -r --arg auteur "app/$APP_SLUG" \
                     '[.[] | select((.isCrossRepository | not) and .author.login == $auteur and (.headRefName | startswith("chore/image-"))) | .number][0] // empty')
          if [ -n "$pr" ]; then
            echo "La PR d'image #$pr est déjà ouverte : vérification de sa fusion automatique."
            suite=existante
          # Sinon, branche ou PR (ouverte ou fermée) déjà là : on ne recommence pas.
          elif git ls-remote --exit-code --heads origin "$branche" >/dev/null 2>&1 \
             || [ -n "$(gh pr list --state all --head "$branche" --json number --jq '.[].number')" ]; then
            echo "::notice::$branche existe déjà (branche ou PR, même fermée) : rien à faire."
            suite=""
          else
            suite=nouvelle
          fi
          # Dernier tag au format AAAA.MM.N, comme le script : base de la liste des changements.
          dernier=$(git tag -l 'devcontainer-*' | sed 's/^devcontainer-//' \
                      | { grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ "$suite" = nouvelle ] && [ -z "$dernier" ]; then
            echo "::error::Aucun tag devcontainer-AAAA.MM.N : impossible de lister les changements de l'image."
            exit 1
          fi
          {
            echo "suite=$suite"
            echo "pr=$pr"
            echo "branche=$branche"
            echo "dernier=$dernier"
          } >> "$GITHUB_OUTPUT"

      - name: Crée la branche et met à jour la version
        if: steps.recherche.outputs.suite == 'nouvelle'
        env:
          VERSION: ${{ steps.decision.outputs.version }}
          BRANCHE: ${{ steps.recherche.outputs.branche }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Commit attribué à l'App, comme la PR.
          id_bot=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id_bot}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE" "$GITHUB_SHA"
          .github/scripts/publier-image.sh remplacer "$VERSION"
          for f in .devcontainer/devcontainer.json exemples/devcontainer.json; do
            grep -qF "\"$IMAGE:$VERSION\"" "$f"
          done
          git commit -am "chore: image $VERSION"
          git push origin "$BRANCHE"

      # Ouverte avec le jeton de l'App : devcontainer.yml se déclenche sur la PR.
      - name: Ouvre la PR
        id: ouverture
        if: steps.recherche.outputs.suite == 'nouvelle'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.decision.outputs.version }}
          BRANCHE: ${{ steps.recherche.outputs.branche }}
          DERNIER: ${{ steps.recherche.outputs.dernier }}
        run: |
          set -euo pipefail
          changements=$(git log --oneline "devcontainer-$DERNIER..$GITHUB_SHA" -- .devcontainer/source | sed 's/^/- /')
          if [ -z "$changements" ]; then
            echo "::error::Aucun commit de .devcontainer/source entre devcontainer-$DERNIER et $GITHUB_SHA, alors que le script en a vu un changement."
            exit 1
          fi
          corps="$RUNNER_TEMP/corps.md"
          cat > "$corps" <<EOT
          Changements de l'image depuis \`devcontainer-$DERNIER\` (commits de \`.devcontainer/source/\`) :

          $changements

          Cette PR change seulement la version de l'image, \`$VERSION\`, dans \`.devcontainer/devcontainer.json\` et \`exemples/devcontainer.json\`. Le smoke-test (devcontainer.yml) construit l'image et compile les exemples de référence sans réseau.

          La fusion automatique (squash) est activée si le dépôt a un ruleset qui exige la CI verte : cette PR est alors fusionnée dès que \`devcontainer.yml\` est au vert. Pour la fusionner à la main, la passer en brouillon ou lui mettre l'étiquette « garder-ouverte ».

          La suite est automatique, une fois la PR fusionnée :
          1. le robot \`publier-image\` pose le tag \`devcontainer-$VERSION\` sur le commit fusionné ;
          2. ce tag déclenche \`devcontainer-publish\`, qui construit, teste et publie \`$IMAGE:$VERSION\` ;
          3. le robot \`suivre-image\` du modèle \`steamicc/arduino-steami-starter\` ouvre sa PR vers cette version.
          EOT
          url=$(gh pr create --base main --head "$BRANCHE" \
            --title "chore: image $VERSION" \
            --body-file "$corps")
          echo "PR ouverte : $url"
          numero="${url##*/}"
          if ! printf '%s' "$numero" | grep -Eq '^[0-9]+$'; then
            echo "::error::Numéro de PR introuvable dans « $url »"
            exit 1
          fi
          echo "pr=$numero" >> "$GITHUB_OUTPUT"

      - name: Active la fusion automatique
        if: steps.recherche.outputs.suite != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.ouverture.outputs.pr || steps.recherche.outputs.pr }}
        run: |
          set -euo pipefail
          etat=$(gh pr view "$PR" --json autoMergeRequest,isDraft,labels \
                   --jq 'if .autoMergeRequest != null then "active"
                         elif .isDraft then "brouillon"
                         elif any(.labels[]; .name == "garder-ouverte") then "gardee"
                         else "" end')
          case "$etat" in
            active)
              echo "La fusion automatique de la PR #$PR est déjà activée."
              exit 0 ;;
            brouillon|gardee)
              # Choix d'un mainteneur : on ne réactive pas la fusion automatique.
              echo "::notice::PR #$PR en brouillon ou avec l'étiquette « garder-ouverte » : fusion automatique laissée désactivée, à fusionner à la main."
              exit 0 ;;
          esac
          # Sans check obligatoire sur main, GitHub fusionnerait tout de suite,
          # même avec une CI rouge : on exige donc les deux jobs de devcontainer.yml.
          contextes=$(gh api "repos/$GH_REPO/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | join("\n")')
          manquants=""
          for check in "tests des commandes" "build & smoke-test"; do
            printf '%s\n' "$contextes" | grep -qxF "$check" || manquants="$manquants « $check »"
          done
          if [ -n "$manquants" ]; then
            echo "::warning::PR #$PR : fusion automatique non activée, car aucune règle de main n'exige les checks$manquants. Créez d'abord un ruleset « CI verte avant fusion » sur main (Settings > Rules > Rulesets, « Require status checks to pass ») avec « tests des commandes » et « build & smoke-test », sinon la PR serait fusionnée même avec une CI rouge. En attendant, fusionnez la PR à la main une fois la CI au vert."
            exit 0
          fi
          if ! gh pr merge "$PR" --auto --squash; then
            echo "::error::Impossible d'activer la fusion automatique de la PR #$PR. Vérifiez « Allow auto-merge » et « Allow squash merging » (Settings > General > Pull Requests), et que l'App a Contents et Pull requests en écriture."
            exit 1
          fi
          echo "Fusion automatique (squash) activée sur la PR #$PR : elle sera fusionnée dès que la CI sera au vert."
